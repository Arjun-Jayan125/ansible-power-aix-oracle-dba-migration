hostname: 129.40.76.242                        # AIX hostname where the Database is running.
service_name: prod                             # Database service name.
listener_port: 1521                            # Database port number.
# oracle_db_home not needed - oracle_redo module uses Thin mode (pure Python, no Oracle client required)
oracle_databases:
       redolog_groups: 3        # Provide the number of required REDO log groups required in the DB.
       redolog_size: 200M       # Redo log file size, the existing redo logs size will be changed to this value.
       state: present           # "present" - creates redo groups, "absent" - drops redo groups.
