hostname: <your_database_host>                 # AIX hostname where the Database is running.
service_name: <your_service_name>              # Database service name.
listener_port: 1521                            # Database port number.
# oracle_db_home not needed - oracle_jobschedule module uses Thin mode (pure Python, no Oracle client required)
state: absent
enabled: True
repeat_interval: FREQ=MINUTELY;INTERVAL=30     # Repeat interval.
comments: This is a test DBMS job schedule.
schedule_name: testuser1.ansi_schedule         # Job Schedule name prefixed with DB username.
