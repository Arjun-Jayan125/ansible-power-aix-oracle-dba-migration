hostname: <your_database_host>                 # AIX hostname where the Database is running.
service_name: <your_service_name>              # Database service name.
listener_port: 1521                            # Database port number.

oracle_databases:
      - roles:
          - name: devrole                              # Name of the role to be created in PDB
        service_name: prod              # Database service name.
        grants:
          - create session                              # Privilege 1 assigned to the role.
          - create any table                            # Privilege 2 assigned to the role.
          - create any view
        state: present                                   # present|absent
