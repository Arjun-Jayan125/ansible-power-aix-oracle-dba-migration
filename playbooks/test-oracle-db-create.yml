---
- hosts: dbhost
  gather_facts: false
  remote_user: oracle
  vars_files:
    - vars/vault.yml
  vars:
    real_oracle_home: /u01/19c/database/dbhome_1

  tasks:
    - name: Test oracle_db create database
      oracle_db:
        oracle_home: "{{ real_oracle_home }}"
        db_name: codextst
        sid: codextst
        sys_password: "{{ default_dbpass }}"
        system_password: "{{ default_dbpass }}"
        dbsnmp_password: "{{ default_dbpass }}"
        hostname: <your_database_host>
        port: 1521
        state: present
        cdb: false
        storage_type: FS
        datafile_dest: /tmp/codextst_data
        recoveryfile_dest: /tmp/codextst_reco
        memory_totalmb: 1024
        datapatch: false
      environment:
        ORACLE_HOME: "{{ real_oracle_home }}"
        LD_LIBRARY_PATH: "{{ real_oracle_home }}/lib"
        PATH: "{{ real_oracle_home }}/bin:{{ ansible_env.PATH | default('') }}"